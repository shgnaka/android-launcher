[package]
name = "quiet-launcher"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "quiet-preview"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
ui = ["dep:eframe"]
# Compile-check the JNI bridge on a development computer as well.
android-check = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "android-native-activity"], optional = true }
jni = "0.21.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "0.15"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
winit = { path = "vendor/winit" }

[package.metadata.android]
package = "dev.quiet.launcher"
apk_name = "quiet-launcher"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Quiet"
icon = "@drawable/ic_launcher"
theme = "@android:style/Theme.Material.Light.NoActionBar"
uses_cleartext_traffic = false
extract_native_libs = true

[package.metadata.android.application.activity]
launch_mode = "singleInstance"
always_retain_task_state = true
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.HOME", "android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.queries.intent]]
actions = ["android.appwidget.action.APPWIDGET_UPDATE"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.PACKAGE_USAGE_STATS"

[[package.metadata.android.uses_permission]]
name = "android.permission.BIND_APPWIDGET"
