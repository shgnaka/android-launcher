[package]
name="quiet-acceptance-fixture"
version="0.1.0"
edition="2021"
publish=false
[workspace]
[lib]
crate-type=["cdylib"]
[dependencies]
android-activity={version="=0.6.1",features=["native-activity"]}
jni="0.21.1"
serde_json="1"
log="0.4"
android_logger="0.15"
[profile.release]
strip=true
[package.metadata.android]
package="example.fixture.core"
apk_name="fixture-core"
[package.metadata.android.sdk]
min_sdk_version=28
target_sdk_version=35
[package.metadata.android.application]
label="Quiet acceptance fixture"
[package.metadata.android.application.activity]
exported=true
